# Initial Production installation; enable only after the private secret is configured.
name = "rccnew-sporteasy-sync-production"
main = "sporteasy-sync.js"
compatibility_date = "2026-10-16"

[triggers]
crons = ["*/10 * * * *"]

[vars]
RCC_SPORTEASY_SYNC_ENABLED = "false"
RCC_PUSH_ENABLED = "false"

[[kv_namespaces]]
binding = "RCC_SPORTEASY_KV"
id = "2f273875520b4362af2f4323aec5ec5b"

[[durable_objects.bindings]]
name = "RCC_SPORTEASY_COORDINATOR"
class_name = "SportEasyCoordinator"

[[migrations]]
tag = "sporteasy-coordinator-v1"
new_sqlite_classes = ["SportEasyCoordinator"]
