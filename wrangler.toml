name = "rccnew"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "."

# Production Pages only; Preview bindings remain separate.
[[env.production.kv_namespaces]]
binding = "RCC_STANDINGS"
id = "fa3dae8644c744c4915f2f23b70a9f51"

# Existing subscriptions: reuse as-is, never recreate the namespace or VAPID keys.
[[env.production.kv_namespaces]]
binding = "RCC_PUSH_SUBSCRIPTIONS"
id = "5e412dc7eadc4548ba85ff30c789fdbc"

[env.production.vars]
RCC_GITHUB_REPOSITORY = "clementbesombes984-glitch/rccnew"
RCC_GITHUB_BRANCH = "main"
RCC_SITE_ORIGIN = "https://rccubzaguais.fr"
RCC_PUSH_ENABLED = "false"
RCC_PUSH_DELIVERY_MODE = "workflow"
RCC_FACEBOOK_READ_ENABLED = "true"

[[env.production.d1_databases]]
binding = "RCC_FACEBOOK_DB"
database_name = "rccnew-facebook-production"
database_id = "d9488355-321c-4298-aba4-f256de6e4b73"
migrations_dir = "migrations/facebook"
