# Isolated Pages PREVIEW only. Never deploy this configuration to main.
name = "rccnew"
pages_build_output_dir = "."
compatibility_date = "2026-10-16"

[vars]
RCC_FACEBOOK_READ_ENABLED = "false"
RCC_PUSH_ENABLED = "false"

[[d1_databases]]
binding = "RCC_FACEBOOK_DB"
database_name = "rccnew-facebook-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_ID"
migrations_dir = "migrations/facebook"

[[r2_buckets]]
binding = "RCC_FACEBOOK_MEDIA"
bucket_name = "rccnew-facebook-media-preview"
